version: 2

sources:
  - name: npci
    description: >
      NPCI's UPI ecosystem statistics as pulled by scripts/npci_upi.py from NPCI's statistics API: one CSV per
      table, one row per entity per month. Volumes in million transactions, values in Rs crore.
    meta:
      external_location: "read_csv('../data/processed/{name}.csv', header = true, sample_size = -1)"
    tables:
      - name: upi_p2p_p2m
        description: National UPI totals per month, split into person-to-person and person-to-merchant.
        columns:
          - name: period
            data_tests: [not_null, unique]
      - name: upi_apps
        description: >
          Volume and value by UPI app. NPCI changed this table's layout in Dec 2020: before it, one
          upi_application_name / upi_volume_mn / upi_value_cr per app; from it, application_name with totals
          split into customer-initiated, B2B, B2C and on-us transactions.
        columns:
          - name: period
            data_tests: [not_null]
      - name: upi_member_vol_val
        description: Top 50 UPI member banks by volume and value. NPCI's Total row is in here, not always flagged.
        columns:
          - name: period
            data_tests: [not_null]
          - name: bank_name
            data_tests:
              # Apr 2017 has one nameless row (0.03 crore); staging drops it. Warn so a new one is seen.
              - not_null:
                  config:
                    severity: warn
      - name: upi_remitter_banks
        description: Per remitter bank, the share of UPI transactions approved, business-declined and technically declined.
        columns:
          - name: period
            data_tests: [not_null]
      - name: upi_autopay_exec
        description: >
          UPI AutoPay mandate executions (recurring debits) at the top 50 remitter banks: attempts and the share
          approved, business-declined and technically declined. Volumes are raw counts up to Nov 2024 and millions
          from Dec 2024.
        columns:
          - name: period
            data_tests: [not_null]
          - name: remitter_bank
            data_tests: [not_null]
      - name: upi_autopay_reg
        description: UPI AutoPay mandate registrations at the top 50 remitter banks, same layout and unit change as executions.
        columns:
          - name: period
            data_tests: [not_null]
          - name: remitter_bank
            data_tests: [not_null]
      - name: nfs_atm_declines
        description: >
          NPCI's shared ATM network (NFS), by card-issuing bank: transactions in millions and the share approved,
          business-declined and technically declined. NPCI leaves about 1% of each bank's transactions unclassified.
        columns:
          - name: period
            data_tests: [not_null]
          - name: issuer_bank_name
            data_tests: [not_null]
