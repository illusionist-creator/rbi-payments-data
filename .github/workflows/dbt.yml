name: dbt build and tests

# Every data refresh already runs dbt build inside update.yml, before it publishes. This workflow checks
# pull requests that touch the dbt project, and can be run by hand.
on:
  pull_request:
    paths: ["dbt/**", ".github/workflows/dbt.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dbt:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dbt
    env:
      DBT_PROFILES_DIR: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: dbt build
