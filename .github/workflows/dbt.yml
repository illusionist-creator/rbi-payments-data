name: dbt build and tests

# Runs the dbt project against the committed data: after every data refresh (the refresh commits with
# the bot's token, which does not trigger push workflows, hence workflow_run), and on any change to dbt/.
on:
  workflow_run:
    workflows: ["Update RBI card data and deploy dashboard"]
    types: [completed]
  push:
    paths: ["dbt/**", ".github/workflows/dbt.yml"]
  pull_request:
    paths: ["dbt/**", ".github/workflows/dbt.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dbt:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dbt
    env:
      DBT_PROFILES_DIR: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || '' }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: dbt build
